version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: event_data_hub_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: event_data_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  app:
    build: .
    container_name: event_data_hub_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/event_data_hub?sslmode=disable
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.6-flash
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    depends_on:
      - postgres

volumes:
  pgdata:
